# pyproject.toml - Project configurations

[project]
name = "microsoft-foundry-workshop"
version = "0.1.0"
description = "Microsoft Foundry Workshop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "azure-ai-projects>=2.0.0", # 統合プロジェクトクライアント
  "azure-identity",           # 認証 (マネージド ID / サービスプリンシパル)
  "openai",                   # Completions API 互換クライアント
  "python-dotenv",            # 環境変数読み込み (.env ファイル)
  "fastapi",                  # Web フレームワーク (App トラック用)
  "uvicorn",                  # ASGI サーバー (App トラック用)
  "websockets",               # WebSocket サポート (App トラック用)
]

[project.optional-dependencies]
dev = ["poethepoet>=0.32.0", "ruff>=0.9.0"]
evaluation = ["azure-ai-evaluation"]        # Module 5〜6: 評価フレームワーク
multi-agent = ["agent-framework"]           # Module 7〜8: マルチエージェント


# --------------------------------------------------------------------
# Build System - Setuptools
# --------------------------------------------------------------------

[tool.setuptools]
packages = []


# --------------------------------------------------------------------
# Tools - UV - Universal Version Manager for Python
# --------------------------------------------------------------------

[tool.uv]
prerelease = "allow"


# --------------------------------------------------------------------
# Tools - Ruff - Flake8 + isort + Black All-in-One Linter and Formatter
# --------------------------------------------------------------------

# Ruff - Flake8 + isort + Black All-in-One Linter and Formatter
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "node_modules", "infra"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# --------------------------------------------------------------------
# Tools - Mypy - Static Type Checker for Python
# --------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = ["^.git/", "^.venv/", "^node_modules/", "^infra/"]


# --------------------------------------------------------------------
# Tools - Poe the Poet - Task Runner
# --------------------------------------------------------------------

[tool.poe.tasks]

# Setup (Development Environment)
[tool.poe.tasks.setup]
shell = "uv tool install pre-commit && pre-commit install --install-hooks"
help = "Set up the development environment (install pre-commit via uv tool and hooks)"

# Lint & Format
[tool.poe.tasks.lint-python]
cmd = "ruff check ."
help = "Run linting with Ruff"

[tool.poe.tasks.format-python]
cmd = "ruff format ."
help = "Run formatting with Ruff"

[tool.poe.tasks.ci]
sequence = ["lint-python", "format-python"]
help = "Run linting and formatting"

# Clean up
[tool.poe.tasks.clean]
cmd = "rm -rf .venv __pycache__ .pytest_cache .ruff_cache *.egg-info"
help = "Remove build artifacts"
